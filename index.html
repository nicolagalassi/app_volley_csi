<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fulgur Volley</title>
  <meta name="description" content="Partite, risultati e classifica della Fulgur nei campionati CSI di pallavolo">
  <meta name="theme-color" content="#0f1b3d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
      <div>
        <h1 id="team-title">Fulgur</h1>
        <p id="data-stamp" class="stamp">Caricamento…</p>
      </div>
      <a id="csi-link" class="csi-link" href="#" target="_blank" rel="noopener" aria-label="Apri il campionato sul sito CSI">CSI
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      </a>
    </div>
  </header>

  <main>
    <section id="view-team" class="view" data-view="team"></section>
    <section id="view-table" class="view" data-view="table" hidden></section>
    <section id="view-calendar" class="view" data-view="calendar" hidden></section>
    <section id="view-update" class="view" data-view="update" hidden></section>
  </main>

  <nav class="tabs" aria-label="Sezioni">
    <button data-tab="team" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3c-2 4-2 14 0 18M3.5 9c5 2 12 2 17 0M4 16c5-3 11-3 16 0"/></svg>
      <span>Partite</span>
    </button>
    <button data-tab="table">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Classifica</span>
    </button>
    <button data-tab="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Calendario</span>
    </button>
    <button data-tab="update">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
      <span>Aggiorna</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
